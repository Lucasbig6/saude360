include:
  - superset/docker-compose.yml

services:
  saude360-postgres:
    image: postgres:16
    container_name: saude360-postgres
    environment:
      POSTGRES_DB: saude360
      POSTGRES_USER: saude360
      POSTGRES_PASSWORD: saude360_password
    ports:
      - "5433:5432"
    volumes:
      - saude360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saude360 -d saude360"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: saude360-backend
    environment:
      DATABASE_URL: postgresql+psycopg://saude360:saude360_password@saude360-postgres:5432/saude360
      TEST_DATABASE_URL: postgresql+psycopg://saude360:saude360_password@saude360-postgres:5432/saude360_test
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_SECRET_KEY: "chave_secreta_monisus_ambiente_dev_123"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      saude360-postgres:
        condition: service_healthy
      superset:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: saude360-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  saude360_pgdata:
  frontend_node_modules:
  frontend_next:
